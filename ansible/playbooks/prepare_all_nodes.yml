---
# Prepare ALL nodes (server + workers) BEFORE cluster creation.
# Running this upfront means:
#   - apt operations and K3s binary download happen once, in parallel, before
#     any Rancher/K3s work starts — nothing blocks on package installs later.
#   - Workers arrive at registration already fully prepared, so worker join
#     takes seconds instead of minutes.
#   - Multus can deploy after workers are Ready with no rollout-wait stall.
#
# What this does on every node:
#   1. common role: apt update/upgrade, required packages, sysctl, swap off
#   2. Pre-stage K3s binary (version from inventory kubernetes_version var)
#      using SKIP_ENABLE + SKIP_START so it never auto-starts.
#      Workers get the agent binary; servers get the server binary.
#      Both populate the rancher K3s data cache so the installer skips the
#      ~70 MB download when Rancher later runs the install script.

- name: Prepare All Nodes
  hosts: management_nodes
  become: true
  gather_facts: true
  vars:
    k3s_version: "{{ kubernetes_version | default('v1.34.5+k3s1') }}"

  tasks:
    - name: Run common role on all nodes
      include_role:
        name: common
      ignore_errors: true

    - name: Pre-stage K3s binary on worker (agent) nodes
      shell: |
        if command -v k3s &>/dev/null 2>&1; then
          echo "k3s already installed, skipping pre-stage"
          exit 0
        fi
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_SKIP_ENABLE=true \
          INSTALL_K3S_SKIP_START=true \
          sh -s - agent 2>&1 | tail -5
      when: "'agent' in node_roles"
      changed_when: false
      failed_when: false
      timeout: 180

    - name: Pre-stage K3s binary on server nodes
      shell: |
        if command -v k3s &>/dev/null 2>&1; then
          echo "k3s already installed, skipping pre-stage"
          exit 0
        fi
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_SKIP_ENABLE=true \
          INSTALL_K3S_SKIP_START=true \
          sh -s - server 2>&1 | tail -5
      when: "'server' in node_roles"
      changed_when: false
      failed_when: false
      timeout: 180
