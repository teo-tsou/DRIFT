# Sample cross-cluster pair inventory for prepare_xcluster_migration.yml
#
# Two edge cluster server nodes (single-node clusters A and B). Each declares
# its own pod CIDR and points at the other as `peer_host`. The DRIFT backend
# generates this dynamically per cluster-pair; this file is for manual runs.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: /root/.ssh/id_rsa
  children:
    xcluster_pair:
      hosts:
        edge-a-084:
          ansible_host: 10.0.1.84
          cluster_pod_cidr: 10.42.0.0/16
          peer_host: edge-b-089
          sync_endpoint_ip: 10.44.0.62
        edge-b-089:
          ansible_host: 10.0.1.89
          cluster_pod_cidr: 10.44.0.0/16
          peer_host: edge-a-084
          sync_endpoint_ip: 10.42.0.70
