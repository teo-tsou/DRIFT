all:
  vars:
    cluster_name: volos-edge
    ansible_ssh_private_key_file: /root/.ssh/id_rsa
    ansible_user: root
    region: default-region
    l2_networks:
      mgmt-net:
        vlan_id: 200
        subnet: "10.0.1.0/24"
        gateway: "10.0.1.1"
        bridge_name: "drift-br0"
        description: "Management network for live migration"
        
        
      storage-net:
        vlan_id: 300
        subnet: "10.1.0.0/24"
        gateway: "10.1.0.1"
        bridge_name: "drift-br1"
        description: "Storage network"

  children:
    edge_regions:
      children:
        management_nodes:
          hosts:
            edge-node-1:
              ansible_host: 10.0.1.69
              node_roles: ["server"]  # Add this back
              interface_mappings:
                - interface: "eth0"
                  l2_network: "mgmt-net"

            edge-node-2:
              ansible_host: 10.0.1.72
              node_roles: ["agent"]   # Add this back
              interface_mappings:
                - interface: "eth0"
                  l2_network: "mgmt-net"