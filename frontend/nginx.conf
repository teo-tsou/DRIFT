server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # "/" serves index.html but does NOT hit the .html regex below, so the app
        # shell was cacheable through this path — the one loophole that kept stale
        # dashboards alive. Same no-store treatment here.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Never cache the app shell + its JS/CSS, so a deploy is always picked up on
    # the very next load (no hard-refresh needed). "no-cache" only forces
    # revalidation and browsers still served stale copies from the bfcache; we go
    # all the way to no-store so the files can't stick at all.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
