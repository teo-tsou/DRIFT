# Migratable YOLO CPU-inference pod — the "real application" of the DRIFT demo:
# in-vehicle perception (object detection) running at the edge, following the UE.
#
# Design rules learned the hard way (from the August 2026 testbed runs):
#  * PREBUILT image (ultralytics CPU): no runtime pip — a pip install races the
#    migration's pre-created target placeholder and bloats/breaks the checkpoint.
#    The image is pulled ONCE per node; after that placeholder creation is fast.
#  * CPU-only: CRIU cannot checkpoint GPU state (and vGPU licensing blocks VMs).
#  * holder+work pattern: required by the DRIFT backend's migration gate.
#  * The timestamp is BURNED into every annotated frame server-side (cv2.putText),
#    so a frozen frame during migration carries the freeze instant in-picture.
#
# Endpoints on the floating IP 10.220.3.103:9000 (follows the pod across clusters):
#   /frame  one annotated JPEG (poll it)      /ue  phone page polling /frame
#   /health JSON: inference ms, fps, classes  /    index
apiVersion: v1
kind: Pod
metadata:
  name: yolo-app
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name":"macvlan-l2","interface":"net1","ips":["10.220.3.103/24"]}]'
spec:
  restartPolicy: Never
  containers:
  - name: holder
    image: docker.io/ultralytics/ultralytics:latest-cpu
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
  - name: work
    image: docker.io/ultralytics/ultralytics:latest-cpu
    imagePullPolicy: IfNotPresent
    env:
    # Swap for a dashcam/driving clip for the CAM story; bunny is the reliable default.
    - name: VIDEO_URL
      value: "https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.240p.vp9.webm"
    - name: YOLO_IMGSZ
      value: "480"
    - name: YOLO_CONF
      value: "0.35"
    command: ["python3", "-u", "-c"]
    args:
    - |
      import http.server, socketserver, threading, time, datetime, os, urllib.request
      import cv2
      os.chdir("/tmp")
      URLS = [u for u in [os.environ.get("VIDEO_URL"),
              "https://download.samplelib.com/mp4/sample-10s.mp4"] if u]
      CLIP = "/tmp/clip.vid"
      for u in URLS:
          try:
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (DRIFT-edge)"})
              data = urllib.request.urlopen(req, timeout=120).read()
              open(CLIP, "wb").write(data)
              print("clip", u, len(data), "bytes", flush=True); break
          except Exception as ex:
              print("fetch failed", u, ex, flush=True)
      from ultralytics import YOLO
      import numpy as np
      model = YOLO("yolov8n.pt")   # ~6 MB, auto-downloaded to /tmp on first start
      IMGSZ = int(os.environ.get("YOLO_IMGSZ", "480"))
      CONF = float(os.environ.get("YOLO_CONF", "0.35"))
      # Pre-decode the clip INTO RAM (as JPEGs) and delete the file: the running
      # process must hold NO open fd on a downloaded file — CRIU restores fds by
      # path, and the migration target cannot be assumed to have the file yet
      # (a real failed-migration cause: "Can't open file tmp/clip.vid on restore").
      # Decode the FULL clip (every 3rd frame) into RAM — the whole sequence loops
      # (~6k frames, ~170 MB as JPEGs). Deliberate trade-off: more RAM state means
      # a bigger CRIU checkpoint and a longer migration freeze (footprint scaling).
      FRAMES = []
      cap = cv2.VideoCapture(CLIP); k = 0
      while True:
          ok, f = cap.read()
          if not ok: break
          if k % 3 == 0:
              okj, b = cv2.imencode(".jpg", f, [cv2.IMWRITE_JPEG_QUALITY, 82])
              if okj: FRAMES.append(b.tobytes())
          k += 1
      cap.release(); os.remove(CLIP)
      print("frames in RAM:", len(FRAMES),
            "(~%.0f MB)" % (sum(len(b) for b in FRAMES) / 1048576), flush=True)
      STATE = {"jpg": None, "infer_ms": None, "fps": 0.0, "classes": {}, "frames": 0}
      def loop():
          last = time.monotonic(); i = 0
          while True:
              frame = cv2.imdecode(np.frombuffer(FRAMES[i % len(FRAMES)], np.uint8),
                                   cv2.IMREAD_COLOR)
              i += 1
              t0 = time.monotonic()
              r = model.predict(frame, imgsz=IMGSZ, conf=CONF, verbose=False)[0]
              ms = (time.monotonic() - t0) * 1000.0
              ann = r.plot()
              now = time.time()
              stamp = (datetime.datetime.fromtimestamp(now).strftime("%Y-%m-%d %H:%M:%S")
                       + ".%d" % (int(now * 10) % 10))
              # compose a PORTRAIT canvas (phone-shaped): annotated feed centered,
              # stamp above it, live stats below — fills a phone/UE frame instead
              # of letterboxing a small 16:9 strip
              CW, CH = 480, 854
              canvas = np.zeros((CH, CW, 3), np.uint8); canvas[:] = (18, 12, 8)
              ah, aw = ann.shape[:2]
              nw = CW; nh = int(ah * (CW / aw))
              y0 = 170
              canvas[y0:y0 + nh, 0:nw] = cv2.resize(ann, (nw, nh))
              cv2.putText(canvas, "DRIFT edge perception", (12, 40),
                          cv2.FONT_HERSHEY_SIMPLEX, 0.8, (200, 200, 210), 2, cv2.LINE_AA)
              cv2.putText(canvas, stamp, (12, 96), cv2.FONT_HERSHEY_SIMPLEX, 0.95,
                          (0, 235, 255), 2, cv2.LINE_AA)
              cv2.putText(canvas, f"server clock - freezes only during migration",
                          (12, 126), cv2.FONT_HERSHEY_SIMPLEX, 0.45, (130, 130, 140), 1, cv2.LINE_AA)
              sy = y0 + nh + 46
              cv2.putText(canvas, f"YOLOv8n CPU  {ms:.0f} ms/frame   {STATE['fps']:.1f} fps",
                          (12, sy), cv2.FONT_HERSHEY_SIMPLEX, 0.62, (120, 220, 120), 2, cv2.LINE_AA)
              names = r.names
              dets = [names[int(c)] for c in (r.boxes.cls.tolist() if r.boxes is not None else [])]
              cv2.putText(canvas, ("now: " + ", ".join(sorted(set(dets))[:4])) if dets else "now: -",
                          (12, sy + 34), cv2.FONT_HERSHEY_SIMPLEX, 0.55, (170, 170, 180), 1, cv2.LINE_AA)
              cv2.putText(canvas, f"frames: {STATE['frames']}", (12, sy + 66),
                          cv2.FONT_HERSHEY_SIMPLEX, 0.5, (120, 120, 130), 1, cv2.LINE_AA)
              okj, buf = cv2.imencode(".jpg", canvas, [cv2.IMWRITE_JPEG_QUALITY, 82])
              if okj:
                  STATE["jpg"] = buf.tobytes()
                  STATE["infer_ms"] = round(ms, 1)
                  STATE["frames"] += 1
                  nowm = time.monotonic()
                  STATE["fps"] = round(1.0 / max(nowm - last, 1e-3), 1); last = nowm
                  names = r.names
                  for c in (r.boxes.cls.tolist() if r.boxes is not None else []):
                      k = names[int(c)]; STATE["classes"][k] = STATE["classes"].get(k, 0) + 1
      threading.Thread(target=loop, daemon=True).start()
      class H(http.server.BaseHTTPRequestHandler):
          def log_message(self, *a): pass
          def _bytes(self, b, ctype):
              self.send_response(200)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(b)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("Access-Control-Allow-Origin", "*")
              self.end_headers(); self.wfile.write(b)
          def do_GET(self):
              if self.path.startswith("/frame"):
                  j = STATE["jpg"]
                  if j is None: self.send_response(503); self.end_headers(); return
                  self._bytes(j, "image/jpeg"); return
              if self.path.startswith("/stream"):
                  # MJPEG push: one connection, a frame per inference — no
                  # per-frame RTT, so a 5G viewer sees the full inference rate.
                  self.send_response(200)
                  self.send_header("Content-Type",
                                   "multipart/x-mixed-replace; boundary=drift")
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
                  seen = -1
                  try:
                      while True:
                          if STATE["frames"] != seen and STATE["jpg"] is not None:
                              seen = STATE["frames"]; j = STATE["jpg"]
                              self.wfile.write(b"--drift\r\nContent-Type: image/jpeg\r\n"
                                               + b"Content-Length: " + str(len(j)).encode()
                                               + b"\r\n\r\n" + j + b"\r\n")
                          time.sleep(0.02)
                  except (BrokenPipeError, ConnectionResetError, OSError):
                      return
              if self.path.startswith("/health"):
                  import json
                  self._bytes(json.dumps({k: v for k, v in STATE.items() if k != "jpg"}).encode(),
                              "application/json"); return
              if self.path.startswith("/ue"):
                  # fetch-based MJPEG reader: renders every pushed frame and
                  # reconnects if none arrives for 8 s (a migration freeze is
                  # shorter and the TCP stream itself survives the move).
                  page = (b'<!doctype html><html><head><meta name="viewport" '
                          b'content="width=device-width,initial-scale=1">'
                          b'<title>DRIFT YOLO</title></head>'
                          b'<body style="margin:0;background:#000">'
                          b'<img id="s" style="width:100vw;height:100vh;object-fit:contain">'
                          b'<script>\n'
                          b'var img=document.getElementById("s"),old=null,last=Date.now(),ctrl=null;\n'
                          b'var td=new TextDecoder();\n'
                          b'function show(j){var u=URL.createObjectURL(new Blob([j],{type:"image/jpeg"}));'
                          b'img.src=u;if(old)URL.revokeObjectURL(old);old=u;last=Date.now();}\n'
                          b'async function go(){if(ctrl)ctrl.abort();ctrl=new AbortController();last=Date.now();\n'
                          b'try{var r=await fetch("/stream",{signal:ctrl.signal,cache:"no-store"});\n'
                          b'var rd=r.body.getReader(),buf=new Uint8Array(0);\n'
                          b'for(;;){var c=await rd.read();if(c.done)break;\n'
                          b'var nb=new Uint8Array(buf.length+c.value.length);nb.set(buf);nb.set(c.value,buf.length);buf=nb;\n'
                          b'for(;;){var head=td.decode(buf.slice(0,160));\n'
                          b'var m=/Content-Length: (\\d+)\\r\\n\\r\\n/.exec(head);if(!m)break;\n'
                          b'var end=head.indexOf(m[0])+m[0].length,n=+m[1];\n'
                          b'if(buf.length<end+n)break;\n'
                          b'show(buf.slice(end,end+n));buf=buf.slice(end+n);}}\n'
                          b'}catch(e){}}\n'
                          b'setInterval(function(){if(Date.now()-last>8000)go();},1000);\n'
                          b'go();\n'
                          b'</script></body></html>')
                  self._bytes(page, "text/html"); return
              self._bytes(b"DRIFT yolo-app: /frame /stream /ue /health", "text/plain")
      class Srv(socketserver.ThreadingTCPServer):
          allow_reuse_address = True; daemon_threads = True
      print("serving :9000", flush=True)
      Srv(("", 9000), H).serve_forever()
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
