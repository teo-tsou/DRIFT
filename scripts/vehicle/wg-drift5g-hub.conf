# DRIFT: hub of the migration tunnels. The vehicle Jetson (Nano) dials in over
# wwan0 (5G), the Orin over its LAN. The hub forwards between them, so CRIU's
# post-copy page server is reachable in both directions with the Nano's side
# always on 5G.
#   Orin -> Nano: the Orin dials 10.250.0.2 through this hub.
#   Nano -> Orin: the Nano routes 10.220.2.170 (the Orin's InternalIP, which
#   the page server binds) into its tunnel; the hub forwards it to the LAN under
#   its own address, so the Orin needs no route back.
[Interface]
Address = 10.250.0.1/24
ListenPort = 51845
MTU = 1340
PostUp = wg set %i private-key /etc/wireguard/drift-hub.key
# Docker's FORWARD policy is DROP; DOCKER-USER is where host rules belong.
PostUp = iptables -I DOCKER-USER -i %i -o %i -j ACCEPT
PostUp = iptables -I DOCKER-USER -i %i -s 10.250.0.2 -d 10.220.2.170 -o eth0 -j ACCEPT
PostUp = iptables -I DOCKER-USER -i eth0 -o %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostUp = iptables -t nat -I POSTROUTING -s 10.250.0.2 -d 10.220.2.170 -o eth0 -j MASQUERADE
PostDown = iptables -D DOCKER-USER -i %i -o %i -j ACCEPT
PostDown = iptables -D DOCKER-USER -i %i -s 10.250.0.2 -d 10.220.2.170 -o eth0 -j ACCEPT
PostDown = iptables -D DOCKER-USER -i eth0 -o %i -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s 10.250.0.2 -d 10.220.2.170 -o eth0 -j MASQUERADE

[Peer]
# jetson-nano-01 (IMSI 999700000000020), over 5G
PublicKey = qr33nwvfAPYkSa+R4GpkcF4xGXS30vEigJv4xAhMsHI=
AllowedIPs = 10.250.0.2/32

[Peer]
# jetson-orin-01, over the LAN
PublicKey = axsCcwyAZRVnD7mStXoNGYfw2bFg8JPhjGZPs98gRjc=
AllowedIPs = 10.250.0.3/32
