# DRIFT: Nano end of the 5G management tunnel to the hub. FwMark 0x45 sends the
# tunnel's own UDP out wwan0 (table 145), so it can never fall back to Ethernet.
[Interface]
Address = 10.250.0.2/24
MTU = 1340
FwMark = 0x45
PostUp = wg set %i private-key /etc/wireguard/drift-nano.key
PostUp = ip rule add fwmark 0x45 lookup 145 priority 99
PostUp = ip route replace unreachable default metric 4000 table 145
PreDown = ip rule del fwmark 0x45 lookup 145 priority 99

[Peer]
# drift hub
PublicKey = ykanA4vu5P8Gcca6MslhjEa//iOgW1MEwZTn3aiUs1s=
Endpoint = 10.220.3.20:51845
# the hub, the Orin (via the hub), and the Orin InternalIP its page server binds
AllowedIPs = 10.250.0.0/24, 10.220.2.170/32
PersistentKeepalive = 25
